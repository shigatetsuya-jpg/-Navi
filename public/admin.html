<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>管理者サイト｜新歓ナビ</title><link rel="stylesheet" href="/style.css"></head><body><header class="top"><a class="brand" href="/"><span class="brandmark">N</span><span>新歓ナビ<small>ADMIN</small></span></a><nav><a href="/">公開サイト ↗</a><a id="logout" class="hidden" href="#">ログアウト</a></nav></header><main class="admin-page"><div class="eyebrow">ADMINISTRATION</div><h1>管理者サイト</h1><div id="notice" class="admin-panel hidden"></div><section id="auth" class="admin-panel"><h2 id="auth-title">ログイン</h2><p id="auth-hint" style="font-size:12px;color:#758078">登録済み管理者のメールアドレスとパスワードを入力してください。</p><form id="auth-form" class="admin-form"><label id="setup-label" class="hidden">セットアップキー<input id="setup-token" type="password" autocomplete="off"></label><label>メールアドレス<input id="email" type="email" required autocomplete="username"></label><label>パスワード<input id="password" type="password" required minlength="12" autocomplete="current-password"></label><button id="auth-submit" class="button primary">ログイン</button></form></section><div id="dashboard" class="hidden"><div class="admin-grid" id="stats"></div><section class="admin-panel"><h2>サークル情報</h2><div class="admin-actions"><button class="button primary" id="add">＋ 新規登録</button><button class="button outline" id="export">CSVを書き出す</button><button class="button outline" id="show-import">一括登録</button></div><div id="editor" class="hidden"><h3 id="editor-title">新規登録</h3><form id="circle-form" class="admin-form"></form></div><div id="rows" class="admin-panel scroll">読み込み中…</div></section><section id="import-box" class="admin-panel hidden"><h2>CSV・JSON一括登録</h2><p style="font-size:12px;color:#758078">同じ団体名と大学名のデータは重複候補として照合します。新規登録では候補を除外し、更新を選ぶと一致した行のみ更新します。</p><div class="admin-actions"><a class="button outline" href="/sample.csv" download>CSVサンプル</a><a class="button outline" href="/sample.json" download>JSONサンプル</a><label class="button outline">ファイルを選ぶ<input id="file" type="file" accept=".csv,.json,application/json,text/csv" hidden></label><select id="import-mode"><option value="insert">新規登録のみ</option><option value="update">一致行を更新・その他は追加</option></select><button class="button primary" id="run-import" disabled>確認して取込</button></div><div id="preview"></div><div id="import-result"></div></section></div></main><script src="/admin.js" defer></script></body></html>
