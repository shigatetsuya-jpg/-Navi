<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fff8f4"><meta name="robots" content="noindex,follow"><title>マイページ｜新歓ナビ</title><link rel="stylesheet" href="/style.css"></head>
<body><header class="top"><a class="brand" href="/"><span class="brandmark">新</span><b>新歓ナビ</b></a><nav><a href="/">サークルを探す</a><a href="/account.html">アカウント</a></nav><div class="top-actions"><button id="logout" class="pill-button">ログアウト</button></div></header>
<main class="account-page dashboard-page"><div class="eyebrow">MY SHINKANAVI</div><h1 id="welcome">マイページ</h1><div id="notice" class="admin-panel hidden" role="status"></div>
<section id="email-status-panel" class="admin-panel hidden"><h2>メール通知</h2><p id="email-status-copy"></p><button id="resend-verification" class="button light hidden" type="button">確認メールを再送</button></section>
<section id="member-dashboard" class="hidden"><p class="account-lead">申し込み状況を確認できます。イベントの閲覧はログインなしでもできます。</p><div class="admin-panel"><div class="section-title"><div><h2>申し込み一覧</h2><p>審査中、承認、キャンセル待ちなどの状態を確認できます。</p></div><a class="button primary" href="/">サークルを探す</a></div><div id="member-applications" class="application-list"></div></div></section>
<section id="org-dashboard" class="hidden"><p class="account-lead">団体専用の運営画面です。申し込みの氏名・学年・メッセージは担当団体だけに表示されます。</p><div id="org-status" class="admin-panel"></div>
<section class="admin-panel"><div class="section-title"><div><h2>イベント・体験会</h2><p>イベントごとに定員と受付状態を設定します。</p></div></div><label class="dashboard-label">管理する団体<select id="circle-select"></select></label><form id="event-form" class="admin-form event-form"><label>イベント名<input name="title" maxlength="160" required></label><label>定員<input name="capacity" type="number" min="1" max="5000" value="20" required></label><label>日時<input name="starts_at" type="datetime-local"></label><label>申込期限<input name="application_deadline" type="datetime-local"></label><label class="wide">開催場所<input name="location" maxlength="300"></label><label class="wide">内容<textarea name="description" maxlength="3000" rows="3"></textarea></label><label>受付状態<select name="status"><option value="draft">下書き</option><option value="open">受付中</option><option value="closed">受付終了</option></select></label><button class="button primary">イベントを作成</button></form><div id="org-events" class="application-list"></div></section>
<section class="admin-panel"><div class="section-title"><div><h2>参加申し込み</h2><p>定員を超える分はキャンセル待ちに入ります。</p></div></div><div id="org-applications" class="application-list"></div></section></section>
</main><script src="/dashboard.js" defer></script></body></html>
