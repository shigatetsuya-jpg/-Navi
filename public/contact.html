<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>お問い合わせ｜ワセサークルナビ</title><link rel="stylesheet" href="/style.css"></head><body><header class="top"><a href="/">ワセサークルナビ</a></header><main class="account-page"><section class="admin-panel"><h1>お問い合わせ・情報の修正／削除依頼</h1><p>運営TSが管理画面で確認します。削除依頼の受付は、削除の実行を意味しません。パスワード等の秘密情報は送らないでください。</p><div id="notice" role="status"></div><form id="support-form" class="admin-form"><label>種類<select name="kind"><option value="inquiry">お問い合わせ</option><option value="correction">情報の修正</option><option value="deletion">削除依頼</option></select></label><label>返信先メール<input name="email" type="email" maxlength="254" required></label><label>対象団体ID（任意）<input name="circle_id" type="number" min="1" readonly></label><label class="wide">内容<textarea name="message" minlength="5" maxlength="3000" required></textarea></label><label class="wide"><input name="accept_privacy" type="checkbox" required><a href="/privacy.html">プライバシーポリシー</a>に同意します</label><button class="button primary">送信する</button></form></section></main><script src="/contact.js" defer></script></body></html>
