services:
  - type: web
    name: waseda-shinkanavi
    runtime: node
    plan: 0.5c-512mb
    region: singapore
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    disk:
      name: shinkanavi-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_PATH
        value: /opt/render/project/src/data/shinkanavi.sqlite
      - key: ADMIN_SETUP_TOKEN
        sync: false
